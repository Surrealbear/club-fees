<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天是星期幾？</title>
<style>
  :root {
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --text: #f5f3ff;
    --muted: rgba(245, 243, 255, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 15% 15%, #4c1d95 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, #0e7490 0%, transparent 45%),
                #0b0b14;
    overflow: hidden;
  }

  /* 漂浮光暈 */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb.one { width: 380px; height: 380px; background: var(--accent); top: -120px; left: -100px; }
  .orb.two { width: 320px; height: 320px; background: var(--accent-2); bottom: -120px; right: -80px; animation-delay: -9s; }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(40px, 30px, 0) scale(1.15); }
  }

  .card {
    position: relative;
    width: min(560px, 100%);
    padding: 48px 40px 40px;
    border-radius: 28px;
    text-align: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .label {
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .day {
    margin: 18px 0 6px;
    font-size: clamp(64px, 16vw, 112px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.04em;
    background: linear-gradient(120deg, #fff 10%, var(--accent-2) 55%, var(--accent) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 24px rgba(124, 92, 255, 0.45));
  }

  .date {
    font-size: 18px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .clock {
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    color: var(--muted);
  }

  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: 36px;
  }

  .week span {
    display: grid;
    place-items: center;
    height: 44px;
    border-radius: 12px;
    font-size: 14px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid transparent;
    transition: transform 0.25s, background 0.25s;
  }

  .week span.today {
    color: #0b0b14;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    box-shadow: 0 8px 24px rgba(124, 92, 255, 0.5);
    transform: translateY(-3px);
  }

  .countdown {
    margin-top: 32px;
    padding-top: 26px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .countdown-label {
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--muted);
  }

  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 14px;
  }

  .unit {
    padding: 12px 4px 10px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .unit b {
    display: block;
    font-size: clamp(22px, 5.5vw, 30px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    color: #fff;
  }

  .unit small {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: rgba(245, 243, 255, 0.35);
  }

  @media (max-width: 420px) {
    .card { padding: 36px 22px 30px; border-radius: 22px; }
    .week { gap: 6px; }
    .week span { height: 40px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="card">
    <p class="label">Today is</p>
    <h1 class="day" id="day">—</h1>
    <p class="date" id="date"></p>
    <p class="clock" id="clock"></p>

    <div class="week" id="week"></div>

    <section class="countdown">
      <p class="countdown-label" id="countdown-label">距離明年 1 月 1 日還有</p>
      <div class="countdown-grid">
        <div class="unit"><b id="cd-days">0</b><small>天</small></div>
        <div class="unit"><b id="cd-hours">0</b><small>小時</small></div>
        <div class="unit"><b id="cd-minutes">0</b><small>分</small></div>
        <div class="unit"><b id="cd-seconds">0</b><small>秒</small></div>
      </div>
    </section>

    <p class="footer">即時更新</p>
  </main>

  <script>
    const DAY_NAMES = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    const SHORT_NAMES = ["日", "一", "二", "三", "四", "五", "六"];

    const dayEl = document.getElementById("day");
    const dateEl = document.getElementById("date");
    const clockEl = document.getElementById("clock");
    const weekEl = document.getElementById("week");

    const countdownLabelEl = document.getElementById("countdown-label");
    const cdDays = document.getElementById("cd-days");
    const cdHours = document.getElementById("cd-hours");
    const cdMinutes = document.getElementById("cd-minutes");
    const cdSeconds = document.getElementById("cd-seconds");

    // 建立一週的格子（週日 → 週六）
    SHORT_NAMES.forEach((name) => {
      const cell = document.createElement("span");
      cell.textContent = name;
      weekEl.appendChild(cell);
    });

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function render() {
      const now = new Date();
      const weekday = now.getDay();

      dayEl.textContent = DAY_NAMES[weekday];

      dateEl.textContent =
        `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日`;

      clockEl.textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      [...weekEl.children].forEach((cell, index) => {
        cell.classList.toggle("today", index === weekday);
      });

      renderCountdown(now);
    }

    function renderCountdown(now) {
      // 下一個 1 月 1 日 00:00:00
      const target = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0, 0);
      let remaining = Math.max(0, target - now);

      const days = Math.floor(remaining / 86400000);
      remaining -= days * 86400000;
      const hours = Math.floor(remaining / 3600000);
      remaining -= hours * 3600000;
      const minutes = Math.floor(remaining / 60000);
      remaining -= minutes * 60000;
      const seconds = Math.floor(remaining / 1000);

      countdownLabelEl.textContent = remaining <= 0 && target - now <= 0
        ? `新年快樂！${target.getFullYear()} 年`
        : `距離 ${target.getFullYear()} 年 1 月 1 日還有`;

      cdDays.textContent = days;
      cdHours.textContent = pad(hours);
      cdMinutes.textContent = pad(minutes);
      cdSeconds.textContent = pad(seconds);
    }

    // 對齊到下一個整秒再更新，避免計時器累積漂移
    function tick() {
      render();
      const delay = 1000 - (Date.now() % 1000);
      setTimeout(tick, delay);
    }

    tick();
  </script>
</body>
</html>
